services:
  minio:
    image: pgsty/silo:RELEASE.2026-11-09T00-00-00Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: topdeal_local
      MINIO_ROOT_PASSWORD: mot-de-passe-local-12345
      MINIO_UPDATE: "off"
    volumes:
      - minio_data:/data

volumes:
  minio_data:
